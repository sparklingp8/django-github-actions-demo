name: Job Dependency Demo

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - run: |
          echo "Running First Job"
          sleep 10

  second-job:
    needs: first-job

    runs-on: ubuntu-latest

    steps:
      - run: echo "Running Second Job"