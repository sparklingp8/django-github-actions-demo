name: feature branch job

on:
  push:
    branches:
      - feature/*

  pull_request:

  workflow_dispatch:

jobs:
  repository-vars-demo:

    runs-on: ubuntu-latest

    env:
      APP_NAME: ${{ vars.APP_NAME }}
      API_KEY: ${{ secrets.API_KEY }}


    steps:

      - name: Print Repository Variables
        run: |
          echo "App Name = $APP_NAME"
          
      - name: Print Secret
        run: |
          echo "API_KEY = $API_KEY"