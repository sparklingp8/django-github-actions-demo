name: Multiple Jobs Demo

on:
  push:
    branches:
      - main

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: First Job
        run: echo "Hello from First Job"

  second-job:
    runs-on: ubuntu-latest

    steps:
      - name: Second Job
        run: echo "Hello from Second Job "
      - name : step 2 job 2
        run : echo "step 2 job 2 running"